name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel an in-progress run when a newer commit is pushed to the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The packages target the UiPath workflow runtime and Studio design/runtime APIs from the public
    # UiPath-Official feed (see nuget.config). They build and test on Windows, matching where they run.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer derives the version from git history + tags, so the full history is required.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 6.0 runtime to execute the net6.0 tests; a modern SDK to build (LangVersion=latest).
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >-
          dotnet test --no-build --configuration Release --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ${{ github.workspace }}/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ github.workspace }}/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7
